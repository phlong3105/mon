# References:
#   - pyproject.toml: https://packaging.python.org/en/latest/
#   - poetry        : https://python-poetry.org/docs/
#   - uv            : https://docs.astral.sh/uv/

[project]
name            = "dev"
version         = "1.3.0"
description     = "Development project"
license         = "MIT"
readme          = "README.md"
requires-python = ">=3.13,<3.14"
authors         = [{ name = "Long H. Pham", email = "longpham3105@gmail.com" }]
keywords        = ["computer vision", "deep learning", "research"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
]
dependencies    = ["mon"]

# [project.urls]
# Homepage      = ""
# Documentation = ""
# Repository    = ""
# Issues        = ""

# --- UV SPECIFIC ---
[tool.uv]
package = true
required-environments = [
    "sys_platform == 'linux' and platform_machine == 'x86_64'"
]

[tool.uv.sources]
mon = { workspace = true }

# --- POETRY SPECIFIC ---
[tool.poetry]
# package-mode = false                    # If you want to use Poetry only for dependency management but not for packaging.
packages = [
    { include = "saleo", from = "src" },
    { include = "slice", from = "src" }
]
include  = []
exclude  = []

[tool.poetry.dependencies]
mon = { path = "../../libs/mon", develop = true }

[build-system]
requires      = ["poetry-core>=2.3.2,<3.0.0"]
build-backend = "poetry.core.masonry.api"
