# --- General ---
exp_name: "slice_dopri5_sice_me_v1"  # (str) Experiment name.

root: ~  # (str) Root path of the project.
output_dir: ~  # (str) Output directory.

task: "enhance"  # (str) Task name (e.g., detect, segment, classify).
mode: "predict"  # (str) Run mode (e.g., train, predict).

device: 0  # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps'
seed: 100  # (int) Random seed for reproducibility

# --- Model ---
model:
  name: "slice"  # (str) Model name (e.g., resnet50, yolov8n).
  arch: "slice"  # (str) Model architecture (e.g., resnet, yolo8).
  in_channels: 3
  hidden_dim: 32
  imgsz: 256
  method: "dopri5"
  # "iter8", "iter5", "iter4", "dopri8", "dopri5", "bosh3", "fehlberg2",
  # "adaptive_heun", "euler", "midpoint", "heun2", "heun3", "rk4",
  # "explicit_adams", "implicit_adams", "fixed_adams", "scipy_solver"
  tol: 0.00001  # 1e-5
  ode_options:
    # step_size: 0.1
    max_num_steps: 1000
  noise_level: ~
  use_depth: False
  use_anscombe: False
  weights: "cv/enhance/slice/slice_dopri5/sice_me/slice_dopri5_sice_me.pt"  # (str) Path to model weights.
  finetune: ~  # (str) Path to fine-tuning weights.

# --- Data ---
train_dataloader:
  dataset:
    name: "sice_me"  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: "sice"  # (str) Directory name of the dataset within the root path.
    subdir: "me"  # (str) Subdirectory name of the dataset.
    split: "train"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 256, width : 256 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    keep_original: False  # (bool) Keep the original data along with augmented ones.
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 8  # (int) Batch size.
  shuffle: True  # (bool) Shuffle the data each epoch.
  num_workers: 4  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

val_dataloader:
  dataset:
    name: "sice_me"  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: "sice"  # (str) Directory name of the dataset within the root path.
    subdir: "me"  # (str) Subdirectory name of the dataset.
    split: "val"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 256, width : 256 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    keep_original: False  # (bool) Keep the original data along with augmented ones.
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 4  # (int) Batch size.
  shuffle: False  # (bool) Shuffle the data each epoch.
  num_workers: 1  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

# --- Training ---
epochs: 100  # (int) Number of epochs to train.
T: 3.0

optimizer:
  name: "Adam"  # (str) Optimizer name.
  lr: 0.00001  # 0.0001 (float) Learning rate.
  # weight_decay: 0.0001

lr_scheduler: ~

lr_warmup_scheduler: ~

loss:
  E: 0.6  # (float) Default is 0.6, but the author suggests 0.5 or 0.45
  W_tv_A: 200
  W_spa: 1
  W_col: 20  # 0.8
  W_col_pre: 10
  W_exp: 10
  W_enhance: 1
  W_denoise: 1  # 50
  W_equi_A: 0

grad_clip_norm: 0.1

tensorboard_logger: True

# --- Prediction ---
predict:
  data: ~  # (list[str]) List of data names or paths for prediction.
  T: 3.0
  strategy: "default"  # (str) Prediction strategy (e.g., default, resize, patch).

  # Resizing strategy: Downsampling -> Inference -> Upsampling.
  imgsz: 256  # (int | list[int]) Image size for prediction.
  upscale: True  # (bool) Whether to upscale the image after inference.
  upsampler:
    name: "interpolation"  # (str) Upsampler name.

  # Patching strategy: Split the image into patches -> Inference on each patch -> Blend the patches.
  patch_size: 512  # (int) Patch size for patch-based prediction.
  overlap: 128  # (int) Number of pixels patches should overlap to blend seams.

# --- Evaluation ---
benchmark: False  # (bool) Benchmark the model.

# --- Saving & Visualization ---
save: True  # (bool) Save the results.
save_debug: False  # (bool) Save the debug information.
keep_subdirs: False  # (bool) Maintain the subdirectories of the data source in the saving directory.
near_src: False  # (bool) Save the results near the source directory.
exist_ok: True  # (bool) If ``False``, delete the existing saving directory.
verbose: True  # (bool) Verbosity mode.
