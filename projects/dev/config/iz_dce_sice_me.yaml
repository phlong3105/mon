# --- General ---
exp_name: "iz_dce_sice_me"  # (str) Experiment name.

root: ~  # (str) Root path of the project.
output_dir: ~  # (str) Output directory.

task: "enhance"  # (str) Task name (e.g., detect, segment, classify).
mode: "predict"  # (str) Run mode (e.g., train, predict).

device: 0  # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps'
seed: 100  # (int) Random seed for reproducibility

# --- Model ---
model:
  name: "iz_dce"  # (str) Model name (e.g., resnet50, yolov8n).
  arch: "iz_dce"  # (str) Model architecture (e.g., resnet, yolo8).
  in_channels: 3
  out_channels: 3
  hidden_dim: 32
  imgsz: 512
  chunk_size: 100000
  num_iter: 8
  weights: "cv/enhance/iz_dce/iz_dce/sice_me/iz_dce_sice_me.pt"  # (str) Path to model weights.
  finetune: ~  # (str) Path to fine-tuning weights.

# --- Data ---
train_dataloader:
  dataset:
    name: "sice_me"  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: "sice"  # (str) Directory name of the dataset within the root path.
    subdir: "me"  # (str) Subdirectory name of the dataset.
    split: "train"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 512, width : 512 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 8  # (int) Batch size.
  shuffle: True  # (bool) Shuffle the data each epoch.
  num_workers: 4  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

val_dataloader:
  dataset:
    name: "sice_me"  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: "sice"  # (str) Directory name of the dataset within the root path.
    subdir: "me"  # (str) Subdirectory name of the dataset.
    split: "val"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 512, width : 512 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 4  # (int) Batch size.
  shuffle: False  # (bool) Shuffle the data each epoch.
  num_workers: 1  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

data: ~  # (list[str]) List of data names or paths for prediction.

# --- Training ---
epochs: 100  # (int) Number of epochs to train.

optimizer:
  name: "Adam"  # (str) Optimizer name.
  lr: 0.0001  # 0.0001 (float) Learning rate.
  weight_decay: 0.0001

lr_scheduler: ~

lr_warmup_scheduler: ~

loss:
  E: 0.6  # (float) Default is 0.6, but the author suggests 0.5 or 0.45
  L_tv_A_w: 200
  L_spa_w: 1
  L_col_w: 20  # 0.8
  L_col_pre_w: 15  # 10
  L_exp_w: 10
  L_enhance_w: 1
  L_denoise_w: 1  # 50

grad_clip_norm: 0.1

# --- Prediction ---
eval_imgsz: 512  # (int | list[int]) Image size for evaluation.
benchmark: False  # (bool) Benchmark the model.

# --- Saving & Visualization ---
save: True  # (bool) Save the results.
save_debug: False  # (bool) Save the debug information.
keep_subdirs: False  # (bool) Maintain the subdirectories of the data source in the saving directory.
near_src: False  # (bool) Save the results near the source directory.
exist_ok: True  # (bool) If ``False``, delete the existing saving directory.
verbose: True  # (bool) Verbosity mode.
