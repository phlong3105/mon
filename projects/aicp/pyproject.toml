#   - uv            : https://docs.astral.sh/uv/

[project]
name            = "aicp"
version         = "0.0.0"
description     = "Active Inplace Copy-Paste Augmentation."
license         = "MIT"
readme          = "README.md"
requires-python = ">=3.12,<3.14"
authors         = [{ name = "Long H. Pham", email = "longpham3105@gmail.com" }]
keywords        = ["data augmentation", "copy-paste", "active learning"]
classifiers     = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python",
]
dependencies    = ["mon"]

# [project.urls]
# Homepage      = ""
# Documentation = ""
# Repository    = ""
# Issues        = ""

[tool.poetry]
# package-mode = false                    # If you want to use Poetry only for dependency management but not for packaging.
# packages = [{ include = "abc_project", from = "src" }]
include  = []
exclude  = []

[tool.poetry.dependencies]
mon = { path = "../../shared/mon", develop = true }

[build-system]
requires      = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

