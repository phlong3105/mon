# --- General ---
exp_name: "tensormog"  # (str) Experiment name.

root: ~  # (str) Root path of the project.
output_dir: ~  # (str) Output directory.

task: "bgsubtract"  # (str) Task name (e.g., detect, segment, classify).
mode: "predict"  # (str) Run mode (e.g., train, predict).

device: 0  # (int | str | list) device: 0 or [0,1,2,3] for CUDA, 'cpu'/'mps'
seed: 0  # (int) Random seed for reproducibility

# --- Model ---
model:
  name: "tensormog"  # (str) Model name (e.g., resnet50, yolov8n).
  arch: "tensormog"  # (str) Model architecture (e.g., resnet, yolo8).
  num_gaussians: 3
  learning_rate: 0.02
  matching_thres: 4
  background_thres: 0.6
  num_updates: 300
  tau_rate: 0.01
  tau_updating_rate: 0.025
  weights: ~  # (str) Path to model weights.
  finetune: ~  # (str) Path to fine-tuning weights.

# --- Data ---
train_dataloader:
  dataset:
    name: ~  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: ~  # (str) Directory name of the dataset within the root path.
    subdir: ~  # (str) Subdirectory name of the dataset.
    split: "train"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 512, width: 512 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    keep_original: False  # (bool) Keep the original data along with augmented ones.
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 1  # (int) Batch size.
  shuffle: True  # (bool) Shuffle the data each epoch.
  num_workers: 4  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

val_dataloader:
  dataset:
    name: ~  # (str) Dataset name.
    root: ~  # (str) Root directory of the dataset.
    dirname: ~  # (str) Directory name of the dataset within the root path.
    subdir: ~  # (str) Subdirectory name of the dataset.
    split: "val"  # (str) Dataset split (e.g., train, val, test, predict).
    transforms:
      ops:
        - { name: "Resize", height: 512, width: 512 }
        - { name: "Normalize", normalization: "min_max" }
        - { name: "ToTensorV2", transpose_mask: True }
      p: 1.0
      seed: ~
    keep_original: False  # (bool) Keep the original data along with augmented ones.
    modalities: ~
    classes: ~
    verbose: True
  batch_size: 1  # (int) Batch size.
  shuffle: False  # (bool) Shuffle the data each epoch.
  num_workers: 1  # (int) Number of workers for data loading.
  drop_last: False  # (bool) Drop the last incomplete batch.

# --- Training ---
epochs: -1  # (int) Number of epochs to train.

optimizer: ~

lr_scheduler: ~

lr_warmup_scheduler: ~

loss: ~

tensorboard_logger: True

# --- Prediction ---
predict:
  data: ~  # (list[str]) List of data names or paths for prediction.
  strategy: "resize"  # (str) Prediction strategy (e.g., default, resize, patch).

  # Resizing strategy: Downsampling -> Inference -> Upsampling.
  imgsz: 512  # (int | list[int]) Image size for prediction.
  upscale: True  # (bool) Whether to upscale the image after inference.
  upsampler:
    name: "interpolation"  # (str) Upsampler name.

  # Patching strategy: Split the image into patches -> Inference on each patch -> Blend the patches.
  patcher:
    name: "hann_window"
    size: 512  # (int) Patch size for patch-based prediction.
    stride: 384  # (int) The step size between patches.

# --- Evaluation ---
benchmark: False  # (bool) Benchmark the model.

# --- Saving & Visualization ---
save: True  # (bool) Save the results.
save_debug: False  # (bool) Save the debug information.
keep_subdirs: False  # (bool) Maintain the subdirectories of the data source in the saving directory.
near_src: False  # (bool) Save the results near the source directory.
exist_ok: True  # (bool) If ``False``, delete the existing saving directory.
verbose: True  # (bool) Verbosity mode.
