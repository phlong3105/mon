# --- Global Settings & Hyperparameters ---
# These settings can be overridden by the CLI.
root        : ~                                                                 # Root directory of the current run.
task        : &task "img2img"                                                   # Task name (e.g., detect, segment, classify).
mode        : &mode "train"                                                     # Mode name (e.g., train, val, test, predict, export).
arch        : &arch "cyclegan"                                                  # Model architecture or family (e.g., resnet).
model       : &model "cyclegan"                                                 # Model name (e.g., resnet50).
data        : &data "horse2zebra"                                               # Dataset name (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "cyclegan_horse2zebra"                                  # Full name of the current run (e.g., resnet50_cifar10_01). If not set, it will be this file's name.
save_dir    : &save_dir ~                                                       # Saving directory. If not set, it will be `root/arch/model/data`.
weights     : &weights "zoo/genai/image/cyclegan/cyclegan/pretrained/horse2zebra/a2b/latest_net_G.pth"  # Path to the pretrained weights.
device      : &device 0                                                         # Running device (i.e., cuda:0 | cuda:0,1,2,3 | cpu).
seed        : &seed 0                                                           # Random seed.
imgsz       : &imgsz 256                                                        # Image size for the model.
# Train
resume      : &resume ~                                                         # Resume from interrupted training.
tuning      : &tuning ~                                                         # Fine-tuning from a pretrained model.
epochs      : &epochs 100                                                       # Training epochs.
batch_size  : &batch_size 1                                                     # Batch size.
torchrun    : False                                                             # If ``True``, use torch.distributed.run to run the training script.
master_port : 7777                                                              # Master port for distributed training.
master_addr : "localhost"                                                       # Master address for distributed training.
local_rank  : -1                                                                # Local rank for distributed training.
# Predict
resize      : False                                                             # Resize the input image to `imgsz`.
benchmark   : False                                                             # Benchmark the model.
# Save & Visualize
save_result : &save_result True                                                 # Save the result of the model.
save_image  : &save_image True                                                  # Save the output image.
save_debug  : &save_debug False                                                 # Save the debug information.
use_fullname: True                                                              # Use the full name for the save_dir.
keep_subdirs: False                                                             # Keep subdirectories in the save_dir.
save_nearby : False                                                             # Save outputs nearby the source.
exist_ok    : &exist_ok True                                                    # If ``False``, it will delete the saving directory if it already exists.
verbose     : &verbose True                                                     # Verbosity.
# Custom config.yaml
cfg         : ~                                                                 # For overriding settings defined in this file.

# --- Model ---
# Network
network:                                                                        # Network architecture.
  model     : "cycle_gan"                                                       # Model to use (e.g., cycle_gan, pix2pix, test, colorization)
  input_nc  : 3                                                                 # Number of input image channels: 3 for RGB and 1 for grayscale.
  output_nc : 3                                                                 # Number of output image channels: 3 for RGB and 1 for grayscale
  ngf       : 64                                                                # Number of generator filters in the last conv layer.
  ndf       : 64                                                                # Number of discriminator filters in the first conv layer.
  netD      : "basic"                                                           # Discriminator to use (e.g., basic, n_layers, pixel). The basic model is a 70x70 PatchGAN. n_layers allows you to specify the layers in the discriminator.
  netG      : "resnet_9blocks"                                                  # Generator to use (e.g., resnet_9blocks, resnet_6blocks, unet_256, unet_128)
  n_layers_D: 3                                                                 # Only used if netD==n_layers
  norm      : "instance"                                                        # Normalization type (e.g., batch, instance, none).
  init_type : "normal"                                                          # Network initialization (e.g., normal, xavier, kaiming, orthogonal).
  init_gain : 0.02                                                              # Scaling factor for normal, xavier and orth
  no_dropout: False                                                             # If ``True``, do not use dropout for the generator.
  direction : "AtoB"                                                            # Direction of translation: AtoB or BtoA.

# Loss
loss: ~                                                                         # Loss functions.

# Optimizer
optimizer:                                                                      # Optimizer.
  lr   : 0.0002
  beta1: 0.5

# --- Data ---
# Train
train_dataloader:                                                               # Train dataloader.
  dataset:
    name      : *data                                                           # Data module name (e.g., cifar10).
    root      : "data/cyclegan"                                                 # Root directory of the dataset.
    split     : "train"                                                         # Dataset split (e.g., train, val, test).
    transform :
      transforms:
        - {name: "Resize", height: 286, width: 286}
        - {name: "RandomCrop", height: *imgsz, width: *imgsz}
        - {name: "HorizontalFlip", p: 0.5}
        - {name: "Normalize", normalization: "min_max"}
        - {name: "ToTensorV2", transpose_mask: True}
      bbox_params    : ~
      keypoint_params: ~
      seed           : ~
    verbose   : *verbose                                                        # Verbosity.
  batch_size : *batch_size                                                      # Batch size.
  shuffle    : True                                                             # If ``True``, shuffle the data.
  num_workers: 4                                                                # Number of workers for data loading.
  drop_last  : False                                                            # If ``True``, drop the last incomplete batch.

# Val
val_dataloader:                                                                 # Val dataloader.
  dataset:
    name      : *data                                                           # Data module name (e.g., cifar10).
    root      : "data/cyclegan"                                                 # Root directory of the dataset.
    split     : "test"                                                          # Dataset split (e.g., train, val, test).
    transform :
      transforms:
        - {name: "Resize", height: 286, width: 286}
        - {name: "RandomCrop", height: *imgsz, width: *imgsz}
        - {name: "HorizontalFlip", p: 0.5}
        - {name: "Normalize", normalization: "min_max"}
        - {name: "ToTensorV2", transpose_mask: True}
      bbox_params    : ~
      keypoint_params: ~
      seed           : ~
    verbose   : *verbose                                                        # Verbosity.
  batch_size :  4                                                               # Batch size.
  shuffle    : False                                                            # If ``True``, shuffle the data.
  num_workers: 1                                                                # Number of workers for data loading.
  drop_last  : False                                                            # If ``True``, drop the last incomplete batch.

# --- Trainer ---
# Trainer
trainer:
  n_epochs_decay: 100                                                           # Number of epochs to linearly decay learning rate to zero.
  gan_mode      : "lsgan"                                                       # GAN objective (e.g., vanilla, lsgan, wgangp). vanilla GAN loss is the cross-entropy objective used in the original GAN paper.
  pool_size     : 50                                                            # The size of image buffer that stores previously generated images.
  lr_policy     : "linear"                                                      # Learning rate policy (e.g., linear, step, plateau, cosine).
  lr_decay_iters: 50                                                            # Multiply by a gamma every lr_decay_iters iterations.

# --- Deploy ---
# Export
export:
  format        : "onnx"                                                        # Export format (e.g., onnx, engine, torchscript, coreml, tflite, openvino).
  opset         : 16                                                            # ONNX: opset version.
  simplify      : False                                                         # ONNX: Simplify model using `onnxslim`.
  trt_precision : "fp32"                                                        # TRT: Precision mode (e.g., fp32, fp16, int8).
  max_batch_size: 32                                                            # TRT: Max batch size for export.
  opt_batch_size: 16                                                            # TRT: Optimize batch size for export.
  min_batch_size: 1                                                             # TRT: Min batch size for export.
