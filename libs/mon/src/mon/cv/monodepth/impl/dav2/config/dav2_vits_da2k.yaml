# --- Global Settings & Hyperparameters ---
# The CLI can override these settings.
root        : ~                                                                 # Root directory of the current run.
task        : &task "depth"                                                     # Task: detect, segment, classify, monodepth, etc.
mode        : &mode "train"                                                     # Mode: train, predict, metric, speed.
arch        : &arch "dav2"                                                      # Architecture (e.g., resnet).
model       : &model "dav2_vits"                                                # Model (e.g., resnet50).
data        : &data "da2k"                                                      # Dataset (e.g., cifar10) or directory (e.g., data/cifar10).
fullname    : &fullname "dav2_vits_da2k"                                        # Fullname of the current run (e.g., resnet50_cifar10_01).
save_dir    : &save_dir ~                                                       # Saving directory.
weights     : &weights "cv/monodepth/dav2/dav2_vits/da2k/dav2_vits_da2k.pth"    # Pre-trained weights' path.
device      : &device 0                                                         # Running device (e.g., 0 | cuda:0 | cuda:0,1,2,3 | cpu).
seed        : &seed 2                                                           # Random seed.
imgsz       : &imgsz 518                                                        # Image size.
# Train
resume      : &resume ~                                                         # Resuming checkpoint.
tuning      : &tuning ~                                                         # Fine-tuning weights.
epochs      : &epochs -1                                                        # Training epochs.
batch_size  : &batch_size 1                                                     # Batch size.
torchrun    : False                                                             # Use torch.distributed.run to run the training script.
master_port : 7777                                                              # Master port for distributed training.
master_addr : "localhost"                                                       # Master address for distributed training.
local_rank  : -1                                                                # Local rank for distributed training.
# Predict
resize      : False                                                             # Resize the input image to ``imgsz``.
benchmark   : False                                                             # Benchmark the model.
# Save & Visualize
save        : &save True                                                        # Save the results.
save_debug  : &save_debug False                                                 # Save the debug information.
use_fullname: True                                                              # Use the full name for the ``save_dir``.
keep_subdirs: False                                                             # Keep subdirectories in the ``save_dir``.
save_nearby : False                                                             # Save nearby the ``data`` source.
exist_ok    : &exist_ok True                                                    # If ``False``, delete the existing saving directory.
verbose     : &verbose True                                                     # Verbosity mode.
# Custom config.yaml
cfg         : ~                                                                 # Override the settings defined in this file.

# --- Model ---
# Network
network: ~                                                                      # Network hyperparameters.

# Optimizer
optimizer: ~                                                                    # Optimizer.

# --- Data ---
# Train
train_dataloader: ~                                                             # Train dataloader.

# Val
val_dataloader: ~                                                               # Val dataloader.

# --- Deploy ---
# Export
export:
  format        : "onnx"                                                        # Export format: onnx, engine, torchscript, coreml, tflite, openvino.
  opset         : 16                                                            # ONNX opset version.
  simplify      : False                                                         # ONNX simplify model using ``onnxslim``.
  trt_precision : "fp32"                                                        # TRT precision mode: fp32, fp16, int8.
  max_batch_size: 32                                                            # TRT max batch size for export.
  opt_batch_size: 16                                                            # TRT optimize batch size for export.
  min_batch_size: 1                                                             # TRT min batch size for export.
