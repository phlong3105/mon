#
# - Install   : conda env create -f environment.yml
# - Update    : conda env update --name one --file environment.yml
# - Update pip: pip list --outdated --format=freeze | grep -v '^\-e' | cut -d = -f 1  | xargs -n1 pip install -U
#

name: mon
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults
dependencies:
  # Core
  - python=3.12
  - git                                 # Distributed version control system.
  - pip                                 # PyPA recommended tool for installing Python packages.
  - poetry                              # Python dependency management and packaging made easy
  # CUDA
  # - cuda-toolkit=12.8                   # CUDA Toolkit - Including CUDA runtime.
  - cuda-toolkit=13.0                   # CUDA Toolkit - Including CUDA runtime.
  - cudnn                               # NVIDIA's cuDNN deep neural network acceleration library.
  - cupy                                # NumPy & SciPy for GPU.
  - nvidia-ml-py                        # Python Bindings for the NVIDIA Management Library.
  - pip:
    # AI
    - tensorrt                          # TensorRT is a high-performance deep learning inference library and runtime.
